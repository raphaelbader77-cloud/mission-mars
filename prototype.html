<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="./art/nova.png">
  <title>Mission Mars • Runtime probe</title>
  <style>
    :root { color-scheme: dark; font: 100%/1.5 system-ui, sans-serif; background:#101d2b; color:#e7f1fa }
    body { max-width:47rem; margin:auto; padding:2rem 1rem }
    th,td { padding:.4rem 1rem; text-align:left; border-bottom:1px solid #536475 }
    dl { display:grid; grid-template-columns:minmax(11rem,1fr) minmax(6rem,2fr); gap:.3rem 1rem }
    dd { margin:0; overflow-wrap:anywhere }
    button { padding:.6rem 1rem; cursor:pointer }
    h1,h2 { color:#ffd398 }
  </style>
</head>
<body>
  <h1>Mission Mars runtime probe</h1>
  <p>This isolated test writes one visit and one log entry. Reload to check whether the two records survive together.</p>
  <p id="status" role="status">Loading Python and PostgreSQL…</p>
  <main id="report" hidden>
    <h2>Python-validated crew query</h2><table><thead><tr><th>Name</th><th>Experience (years)</th></tr></thead><tbody></tbody></table>
    <h2>Run details</h2><dl></dl>
    <button id="reload">Reload and check restoration</button>
  </main>
  <script type="module" src="./prototype/browser.mjs"></script>
</body>
</html>
